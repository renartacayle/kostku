<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Cache Control: Always fetch latest app bundle -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Search Engine & Crawler Optimization (Pure Indexing, No Ads) -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />
    <meta name="description" content="KostKu - Sistem Manajemen Hunian & Kos Pintar Modern Berbasis Denah Interaktif 2D/3D & Monitoring Kamar Real-time." />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#080d1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KostKu" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="KostKu" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts (Plus Jakarta Sans + JetBrains Mono for Tabular Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services (Sign In with Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <title>KostKu - Manajemen Kost Pintar Multi-Device</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clear outdated caches immediately on page load
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            if (key !== 'kostku-cache-v120') {
              console.log('[KostKu] Purging old cache storage:', key);
              caches.delete(key);
            }
          });
        });
      }

      // Register PWA Service Worker with aggressive auto-update
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('KostKu SW registered:', reg.scope);
            // Force update check
            reg.update();
            reg.onupdatefound = () => {
              const installing = reg.installing;
              if (installing) {
                installing.onstatechange = () => {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[KostKu] New Service Worker installed, skip waiting...');
                    installing.postMessage({ type: 'SKIP_WAITING' });
                  }
                };
              }
            };
          }).catch((err) => console.log('KostKu SW registration failed:', err));
        });

        // Auto reload when controller changes
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log('[KostKu] Controller changed, auto reloading page...');
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
