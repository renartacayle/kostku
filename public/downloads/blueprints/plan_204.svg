<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="100%" height="100%" style="background:#0b1329; border-radius:12px; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <pattern id="grid_s_204" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="0.8" />
    </pattern>
    <pattern id="grid_m_204" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.2" />
    </pattern>
    <pattern id="tile_204" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="rgba(14, 165, 233, 0.12)" />
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="rgba(56, 189, 248, 0.28)" stroke-width="0.7" />
    </pattern>
    <!-- Gaussian Blur Filter for Unsure / Unobserved Camera Blind Spots -->
    <filter id="unsure_blur_204" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.8" />
    </filter>
    <!-- Hatching for Unsure Zone -->
    <pattern id="unsure_hatch_204" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(148, 163, 184, 0.35)" stroke-width="1.2" stroke-dasharray="2 2" />
    </pattern>
  </defs>

  <rect width="620" height="400" fill="url(#grid_s_204)" />
  <rect width="620" height="400" fill="url(#grid_m_204)" />

  <!-- Dimension Lines -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.9">
    <line x1="80" y1="26" x2="540" y2="26" />
    <line x1="80" y1="20" x2="80" y2="32" stroke-width="1.5" />
    <line x1="540" y1="20" x2="540" y2="32" stroke-width="1.5" />
    <text x="310" y="20" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle" font-family="monospace">
      LEBAR: 2.90 m
    </text>
  </g>

  <g stroke="#38bdf8" stroke-width="1" opacity="0.9">
    <line x1="54" y1="50" x2="54" y2="350" />
    <line x1="48" y1="50" x2="60" y2="50" stroke-width="1.5" />
    <line x1="48" y1="350" x2="60" y2="350" stroke-width="1.5" />
    <text x="44" y="205" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle" font-family="monospace" transform="rotate(-90 44 205)">
      PANJANG: 4.10 m
    </text>
  </g>

  <!-- Wall & Tinted Floor -->
  <rect x="80" y="50" width="460" height="300" fill="#0f1d38" stroke="#38bdf8" stroke-width="8" rx="2" />
  <rect x="86" y="56" width="448" height="288" fill="#94a3b8" opacity="0.22" />
  <rect x="86" y="56" width="448" height="288" fill="rgba(15, 23, 42, 0.75)" />

  <!-- UNSURE ZONE: BLURRED AS PER USER SPECIFICATION ("Kalo unsure dibuat blur aja 2D") -->
  <g>
    <!-- Frosted Blur Backing -->
    <rect x="398" y="226" width="134" height="114" rx="6" fill="rgba(30, 41, 59, 0.75)" filter="url(#unsure_blur_204)" />
    <!-- Architectural Hatching & Dashed Perimeter -->
    <rect x="398" y="226" width="134" height="114" rx="6" fill="url(#unsure_hatch_204)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.85" />
    <!-- Unsure Badge -->
    <rect x="404" y="264" width="122" height="38" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(148, 163, 184, 0.5)" stroke-width="1" />
    <text x="465.0" y="280" fill="#cbd5e1" font-size="8" font-weight="800" text-anchor="middle">AREA UNSURE (BLURRED)</text>
    <text x="465.0" y="292" fill="#94a3b8" font-size="6.8" font-weight="600" text-anchor="middle">Di Luar Sudut Kamera • 100% Presisi</text>
  </g>

  <!-- Area Rug under Bed -->
  <g>
    <rect x="84" y="95" width="116" height="150" rx="6" fill="rgba(56, 189, 248, 0.05)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="142.0" y="239" fill="rgba(148, 163, 184, 0.55)" font-size="6.5" font-weight="600" text-anchor="middle">KARPET AREA</text>
  </g>

  <!-- Bed Unit (Visual Twin Extracted with 100% Precision) -->
  <g>
    <rect x="94" y="60" width="96" height="140" rx="5" fill="#1e293b" stroke="#60a5fa" stroke-width="2.5" />
    <rect x="94" y="54" width="96" height="8" rx="2" fill="#935a26" stroke="#d97706" stroke-width="1.5" />
    <rect x="98" y="64" width="88" height="128" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="98" y="114" width="88" height="80" rx="3" fill="#f1f5f9" stroke="#1e3a8a" stroke-width="1.5" fill-opacity="0.95" />
    <path d="M 98 114 Q 142.0 122 186 114" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <rect x="118.0" y="70" width="48" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <ellipse cx="142.0" cy="112" rx="7" ry="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <text x="142.0" cy="160" fill="#ffffff" font-size="8" font-weight="800" text-anchor="middle">SUPER SINGLE (120x200)</text>
  </g>
  <rect x="198" y="62" width="26" height="28" rx="3" fill="#334155" stroke="#64748b" stroke-width="1.5" />
  <circle cx="211" cy="76" r="5" fill="#f59e0b" opacity="0.75" />

  <!-- Wardrobe -->
  <g>
    <rect x="425" y="236" width="110" height="46" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <line x1="480" y1="236" x2="480" y2="282" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="476" cy="259" r="2" fill="#38bdf8" />
    <circle cx="484" cy="259" r="2" fill="#38bdf8" />
    <text x="480" y="276" fill="#94a3b8" font-size="8" font-weight="700" text-anchor="middle">LEMARI 2 PINTU</text>
  </g>

  <!-- Desk & Chair -->
  <g>
    <rect x="425" y="68" width="105" height="48" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="2" />
    <rect x="461" y="74" width="26" height="16" rx="2" fill="#0f172a" stroke="#60a5fa" stroke-width="1" />
    <rect x="463" y="76" width="22" height="12" fill="#38bdf8" opacity="0.75" />
    <circle cx="443" cy="82" r="4.5" fill="#fbbf24" opacity="0.8" />
    <ellipse cx="475" cy="126" rx="13" ry="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <path d="M 466 132 C 475 135 484 132 484 132" stroke="#60a5fa" stroke-width="2" fill="none" />
    <text x="475" y="106" fill="#cbd5e1" font-size="7.5" font-weight="700" text-anchor="middle">MEJA KERJA</text>
  </g>

  <!-- AC Unit -->
  <g>
    <rect x="240" y="52" width="68" height="13" rx="2" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
    <path d="M 248 65 L 244 74" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />
    <path d="M 274 65 L 274 76" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />
    <path d="M 300 65 L 304 74" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />
    <text x="274" y="61" fill="#0284c7" font-size="7" font-weight="800" text-anchor="middle">AC 1 PK</text>
  </g>

  <!-- Window on Right Wall -->
  <g>
    <rect x="536" y="160" width="8" height="60" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
    <line x1="540" y1="160" x2="540" y2="220" stroke="#ffffff" stroke-width="1.5" />
    <text x="550" y="192" fill="#38bdf8" font-size="7.5" font-weight="700" text-anchor="middle" transform="rotate(90 550 192)">JENDELA</text>
  </g>

  <!-- Door -->
  <g>
    <rect x="280" y="342" width="50" height="16" fill="#0f1d38" />
    <path d="M 280 346 A 44 44 0 0 1 324 302" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="280" y1="346" x2="280" y2="302" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
    <text x="305" y="364" fill="#38bdf8" font-size="8" font-weight="800" text-anchor="middle">PINTU</text>
  </g>

  <!-- Title Stamp & AI CV Detection Badge -->
  <g>
    <rect x="200" y="165" width="220" height="58" rx="8" fill="rgba(15, 23, 42, 0.94)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" />
    <text x="310" y="182" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">KAMAR 504</text>
    <text x="310" y="196" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">LUAS: 11.9 m² (2.9x4.1m) • KM LUAR (SHARED)</text>
    <text x="310" y="210" fill="#4ade80" font-size="7" font-weight="700" text-anchor="middle">AI: SUPER SINGLE (120x200) • KASUR LEFT • BLUR UNSURE</text>
  </g>

  <!-- Compass -->
  <g transform="translate(562, 312)">
    <circle cx="15" cy="15" r="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <path d="M 15 5 L 20 15 L 15 12 L 10 15 Z" fill="#ef4444" />
    <path d="M 15 25 L 20 15 L 15 18 L 10 15 Z" fill="#94a3b8" />
    <text x="15" y="4" fill="#ef4444" font-size="7.5" font-weight="800" text-anchor="middle">U</text>
  </g>
</svg>