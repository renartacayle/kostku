<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%" style="background:#090e17; border-radius:14px; font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Architectural Fine Grid (16px) -->
    <pattern id="grid_cad_252" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(148, 163, 184, 0.04)" stroke-width="0.75" />
    </pattern>
    <!-- Architectural Major Module Grid (80px) -->
    <pattern id="grid_major_252" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
    </pattern>
    <!-- Luxury Parquet Wood Floor Pattern -->
    <pattern id="parquet_252" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#e2e8f0" fill-opacity="0.32" />
      <path d="M 0 10 L 40 10 M 20 0 L 20 10 M 0 20 L 40 20 M 40 10 L 40 20 M 0 0 L 0 10" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.6" />
    </pattern>
    <!-- Bathroom Ceramic Micro-Tile Pattern -->
    <pattern id="bm_tile_252" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#0f2338" />
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="0.6" />
    </pattern>
    <!-- Frosted Glass Blur Filter for Camera Blind Spot -->
    <filter id="frost_blur_252" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
    </filter>
    <!-- Architectural 45-deg Hatch for Blind Spot -->
    <pattern id="blind_hatch_252" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.2" stroke-dasharray="2 2" />
    </pattern>
    <!-- Reading Lamp Warm Radial Glow -->
    <radialGradient id="lamp_glow_252">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="drop_shadow_252" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background CAD Drafting Paper -->
  <rect width="680" height="480" fill="#090e17" />
  <rect width="680" height="480" fill="url(#grid_cad_252)" />
  <rect width="680" height="480" fill="url(#grid_major_252)" />

  <!-- Sheet Crop Registration Marks (Architectural Standard) -->
  <g stroke="rgba(148, 163, 184, 0.35)" stroke-width="1">
    <path d="M 14 20 L 20 20 M 20 14 L 20 20" />
    <path d="M 666 20 L 660 20 M 660 14 L 660 20" />
    <path d="M 14 460 L 20 460 M 20 466 L 20 460" />
    <path d="M 666 460 L 660 460 M 660 466 L 660 460" />
  </g>

  <!-- ── DIMENSION LINES (PROPORTIONAL 45° ARCHITECTURAL TICKS) ── -->
  <!-- Top Horizontal Dimension (Width) -->
  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="152" y1="51" x2="439" y2="51" opacity="0.85" />
    <line x1="147" y1="56" x2="157" y2="46" stroke-width="1.8" />
    <line x1="434" y1="56" x2="444" y2="46" stroke-width="1.8" />
    <line x1="152" y1="63" x2="152" y2="43" opacity="0.4" stroke-width="0.75" />
    <line x1="439" y1="63" x2="439" y2="43" opacity="0.4" stroke-width="0.75" />
    <rect x="253.5" y="39" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="295.5" y="53" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      4.10 m
    </text>
  </g>

  <!-- Left Vertical Dimension (Length) -->
  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="134" y1="69" x2="134" y2="391" opacity="0.85" />
    <line x1="129" y1="74" x2="139" y2="64" stroke-width="1.8" />
    <line x1="129" y1="396" x2="139" y2="386" stroke-width="1.8" />
    <line x1="146" y1="69" x2="126" y2="69" opacity="0.4" stroke-width="0.75" />
    <line x1="146" y1="391" x2="126" y2="391" opacity="0.4" stroke-width="0.75" />
    <g transform="translate(134, 230.0)">
      <rect x="-42" y="-10" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" transform="rotate(-90)" />
      <text x="0" y="4" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5" transform="rotate(-90)">
        4.60 m
      </text>
    </g>
  </g>

  <!-- ── DYNAMICALLY PROPORTIONAL ROOM FLOOR ── -->
  <rect x="152" y="69" width="287" height="322" rx="2" fill="url(#parquet_252)" />
  <rect x="152" y="69" width="287" height="322" fill="none" stroke="rgba(0, 0, 0, 0.38)" stroke-width="5" />

  <!-- ── ARCHITECTURAL CAVITY WALLS (PROPORTIONAL DOUBLE LINE) ── -->
  <rect x="147" y="64" width="297" height="332" fill="none" stroke="#1e293b" stroke-width="8" rx="2" />
  <rect x="143" y="60" width="305" height="340" fill="none" stroke="#475569" stroke-width="1" rx="3" />
  <rect x="151" y="68" width="289" height="324" fill="none" stroke="#64748b" stroke-width="1" rx="1" />

  <!-- 🌫️ CAMERA BLIND SPOT (FROSTED ARCHITECTURAL BLUR) -->
  <g id="unsure_zone" opacity="0.95">
    <rect x="356" y="308" width="77" height="77" rx="5" fill="rgba(15, 23, 42, 0.85)" filter="url(#frost_blur_252)" />
    <rect x="356" y="308" width="77" height="77" rx="5" fill="url(#blind_hatch_252)" stroke="rgba(244, 63, 94, 0.45)" stroke-width="1" stroke-dasharray="3 2" />
    
    <rect x="362" y="333" width="65" height="26" rx="4" fill="rgba(15, 23, 42, 0.94)" stroke="rgba(244, 63, 94, 0.5)" stroke-width="0.8" />
    <text x="394.5" y="344" fill="#fda4af" font-size="7.5" font-weight="700" text-anchor="middle" letter-spacing="0.3">
      ⚲ BLIND SPOT
    </text>
    <text x="394.5" y="353" fill="#94a3b8" font-size="6" font-weight="500" text-anchor="middle">
      Sudut Terbatas Kamera
    </text>
  </g>

  <!-- Area Rug -->
  <rect x="152" y="102" width="128" height="150" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(148, 163, 184, 0.18)" stroke-width="0.8" stroke-dasharray="3 2" />

  <!-- 🛏️ BED CAD BLOCK (True Scale to Room) -->
  <g id="bed_unit" filter="url(#drop_shadow_252)">
    <!-- Solid Wood Headboard -->
    <rect x="160" y="71" width="112" height="8" rx="2" fill="#3b271d" stroke="#78350f" stroke-width="1" />
    
    <!-- Reading Lamp Spots -->
    <circle cx="172" cy="75" r="12" fill="url(#lamp_glow_252)" />
    <circle cx="260" cy="75" r="12" fill="url(#lamp_glow_252)" />
    <circle cx="172" cy="75" r="2.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />
    <circle cx="260" cy="75" r="2.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />

    <!-- White Mattress Sheet Base -->
    <rect x="162" y="77" width="108" height="140" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

    <!-- Duvet with Exact Photo Blanket Hex -->
    <rect x="162" y="121" width="108" height="94" rx="3" fill="#f8fafc" stroke="rgba(0,0,0,0.15)" stroke-width="0.8" />
    
    <!-- Turnback Line -->
    <path d="M 162 121 Q 216.0 127 270 121" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Accent Bed Runner -->
    <rect x="162" y="185" width="108" height="24" fill="#15803d" opacity="0.88" />
    <line x1="162" y1="185" x2="270" y2="185" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />

    <!-- Dual Hotel Pillows -->
    <rect x="166" y="83" width="42" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <path d="M 172 95 Q 187.0 98 202 95" fill="none" stroke="#cbd5e1" stroke-width="0.8" />
    
    <rect x="224" y="83" width="42" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <path d="M 230 95 Q 245.0 98 260 95" fill="none" stroke="#cbd5e1" stroke-width="0.8" />
  </g>

  <!-- Bedside Nakas -->
  <g filter="url(#drop_shadow_252)">
    <rect x="278" y="79" width="22" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="289" cy="90" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" opacity="0.85" />
    <circle cx="289" cy="90" r="1.5" fill="#d97706" />
  </g>

  <!-- 🚪 WARDROBE (Scaled) -->
  <g id="wardrobe" filter="url(#drop_shadow_252)">
    <rect x="351" y="345" width="80" height="38" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <line x1="357" y1="364.0" x2="425" y2="364.0" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="391.0" y1="345" x2="391.0" y2="383" stroke="#38bdf8" stroke-width="1.2" />
  </g>

  <!-- 🖥️ WORK DESK & ERGONOMIC CHAIR (Scaled) -->
  <g id="desk_setup" filter="url(#drop_shadow_252)">
    <rect x="357" y="77" width="74" height="38" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <!-- Laptop -->
    <rect x="382.0" y="83" width="24" height="15" rx="1.5" fill="#0f172a" stroke="#60a5fa" stroke-width="0.8" />
    <rect x="384.0" y="85" width="20" height="10" rx="1" fill="#38bdf8" opacity="0.65" />
    <!-- Ergonomic Chair -->
    <ellipse cx="394.0" cy="125" rx="11" ry="8" fill="#334155" stroke="#94a3b8" stroke-width="1" />
    <path d="M 384.0 129 Q 394.0 132 404.0 129" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ❄️ AC UNIT -->
  <g id="ac_unit">
    <rect x="187" y="70" width="58" height="10" rx="2" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2" />
    <line x1="192" y1="77" x2="240" y2="77" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="239" cy="74" r="1" fill="#22c55e" />
  </g>

  <!-- 🧊 MINI FRIDGE -->
  <g id="fridge" filter="url(#drop_shadow_252)">
    <rect x="396" y="230" width="35" height="35" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <line x1="427" y1="236" x2="427" y2="259" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- 🪟 WINDOW (RIGHT WALL) -->
  <g id="window_right">
    <rect x="440" y="192" width="6" height="77" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <line x1="443" y1="192" x2="443" y2="268" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- 🚪 MAIN ENTRANCE DOORWAY -->
  <g id="main_door">
    <rect x="266" y="387" width="60" height="8" fill="#090e17" />
    <path d="M 266 391 A 52 52 0 0 1 318 339" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.75" />
    <line x1="266" y1="391" x2="266" y2="339" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="271" cy="347" r="1.5" fill="#38bdf8" />
  </g>

  <!-- ── SWISS ARCHITECTURAL TITLE BLOCK (CARTOUCHE) ── -->
  <g id="title_block" transform="translate(435, 428)">
    <rect x="0" y="0" width="230" height="40" rx="6" fill="rgba(12, 21, 39, 0.96)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <text x="10" y="14" fill="#f8fafc" font-size="9" font-weight="800" letter-spacing="0.5">
      UNIT 602 • 18.9 m²
    </text>
    <text x="10" y="25" fill="#38bdf8" font-size="7.5" font-weight="700">
      QUEEN BED (160x200)
    </text>
    <text x="10" y="34" fill="#94a3b8" font-size="6.5" font-weight="500">
      KM LUAR (SHARED) • SKALA 1:50
    </text>
    <!-- Micro CAD Version Seal -->
    <rect x="180" y="7" width="40" height="26" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8" />
    <text x="200" y="18" fill="#38bdf8" font-size="6.5" font-weight="800" text-anchor="middle">CAD</text>
    <text x="200" y="27" fill="#4ade80" font-size="5.8" font-weight="700" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- ── MINIMALIST ARCHITECTURAL COMPASS (NORTH) ── -->
  <g id="north_compass" transform="translate(625, 35)">
    <circle cx="15" cy="15" r="13" fill="rgba(12, 21, 39, 0.9)" stroke="rgba(148, 163, 184, 0.4)" stroke-width="1" />
    <line x1="15" y1="4" x2="15" y2="26" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.75" />
    <line x1="4" y1="15" x2="26" y2="15" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.75" />
    <polygon points="15,6 18,15 15,13 12,15" fill="#38bdf8" />
    <polygon points="15,24 18,15 15,17 12,15" fill="#475569" />
    <text x="15" y="2" fill="#38bdf8" font-size="7" font-weight="900" text-anchor="middle">U</text>
  </g>
</svg>