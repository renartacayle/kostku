<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%" style="background:#090e17; border-radius:14px; font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Architectural Fine Grid (16px) -->
    <pattern id="grid_cad_227" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(148, 163, 184, 0.04)" stroke-width="0.75" />
    </pattern>
    <!-- Architectural Major Module Grid (80px) -->
    <pattern id="grid_major_227" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
    </pattern>
    <!-- Luxury Parquet Wood Floor Pattern -->
    <pattern id="parquet_227" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#5b3b70" fill-opacity="0.32" />
      <path d="M 0 10 L 40 10 M 20 0 L 20 10 M 0 20 L 40 20 M 40 10 L 40 20 M 0 0 L 0 10" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.6" />
    </pattern>
    <!-- Bathroom Ceramic Micro-Tile Pattern -->
    <pattern id="bm_tile_227" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#0f2338" />
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="0.6" />
    </pattern>
    <!-- Frosted Glass Blur Filter for Camera Blind Spot -->
    <filter id="frost_blur_227" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
    </filter>
    <!-- Architectural 45-deg Hatch for Blind Spot -->
    <pattern id="blind_hatch_227" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.2" stroke-dasharray="2 2" />
    </pattern>
    <!-- Reading Lamp Warm Radial Glow -->
    <radialGradient id="lamp_glow_227">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="drop_shadow_227" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background CAD Drafting Paper -->
  <rect width="680" height="480" fill="#090e17" />
  <rect width="680" height="480" fill="url(#grid_cad_227)" />
  <rect width="680" height="480" fill="url(#grid_major_227)" />

  <!-- Sheet Crop Registration Marks (Architectural Standard) -->
  <g stroke="rgba(148, 163, 184, 0.35)" stroke-width="1">
    <path d="M 14 20 L 20 20 M 20 14 L 20 20" />
    <path d="M 666 20 L 660 20 M 660 14 L 660 20" />
    <path d="M 14 460 L 20 460 M 20 466 L 20 460" />
    <path d="M 666 460 L 660 460 M 660 466 L 660 460" />
  </g>

  <!-- ── DIMENSION LINES (PROPORTIONAL 45° ARCHITECTURAL TICKS) ── -->
  <!-- Top Horizontal Dimension (Width) -->
  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="172" y1="62" x2="417" y2="62" opacity="0.85" />
    <line x1="167" y1="67" x2="177" y2="57" stroke-width="1.8" />
    <line x1="412" y1="67" x2="422" y2="57" stroke-width="1.8" />
    <line x1="172" y1="74" x2="172" y2="54" opacity="0.4" stroke-width="0.75" />
    <line x1="417" y1="74" x2="417" y2="54" opacity="0.4" stroke-width="0.75" />
    <rect x="252.5" y="50" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="294.5" y="64" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      3.50 m
    </text>
  </g>

  <!-- Left Vertical Dimension (Length) -->
  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="154" y1="80" x2="154" y2="381" opacity="0.85" />
    <line x1="149" y1="85" x2="159" y2="75" stroke-width="1.8" />
    <line x1="149" y1="386" x2="159" y2="376" stroke-width="1.8" />
    <line x1="166" y1="80" x2="146" y2="80" opacity="0.4" stroke-width="0.75" />
    <line x1="166" y1="381" x2="146" y2="381" opacity="0.4" stroke-width="0.75" />
    <g transform="translate(154, 230.5)">
      <rect x="-42" y="-10" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" transform="rotate(-90)" />
      <text x="0" y="4" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5" transform="rotate(-90)">
        4.30 m
      </text>
    </g>
  </g>

  <!-- ── DYNAMICALLY PROPORTIONAL ROOM FLOOR ── -->
  <rect x="172" y="80" width="245" height="301" rx="2" fill="url(#parquet_227)" />
  <rect x="172" y="80" width="245" height="301" fill="none" stroke="rgba(0, 0, 0, 0.38)" stroke-width="5" />

  <!-- ── ARCHITECTURAL CAVITY WALLS (PROPORTIONAL DOUBLE LINE) ── -->
  <rect x="167" y="75" width="255" height="311" fill="none" stroke="#1e293b" stroke-width="8" rx="2" />
  <rect x="163" y="71" width="263" height="319" fill="none" stroke="#475569" stroke-width="1" rx="3" />
  <rect x="171" y="79" width="247" height="303" fill="none" stroke="#64748b" stroke-width="1" rx="1" />

  <!-- 🌫️ CAMERA BLIND SPOT (FROSTED ARCHITECTURAL BLUR) -->
  <g id="unsure_zone" opacity="0.95">
    <rect x="178" y="298" width="77" height="77" rx="5" fill="rgba(15, 23, 42, 0.85)" filter="url(#frost_blur_227)" />
    <rect x="178" y="298" width="77" height="77" rx="5" fill="url(#blind_hatch_227)" stroke="rgba(244, 63, 94, 0.45)" stroke-width="1" stroke-dasharray="3 2" />
    
    <rect x="184" y="323" width="65" height="26" rx="4" fill="rgba(15, 23, 42, 0.94)" stroke="rgba(244, 63, 94, 0.5)" stroke-width="0.8" />
    <text x="216.5" y="334" fill="#fda4af" font-size="7.5" font-weight="700" text-anchor="middle" letter-spacing="0.3">
      ⚲ BLIND SPOT
    </text>
    <text x="216.5" y="343" fill="#94a3b8" font-size="6" font-weight="500" text-anchor="middle">
      Sudut Terbatas Kamera
    </text>
  </g>

  <!-- Area Rug -->
  <rect x="238" y="113" width="114" height="150" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(148, 163, 184, 0.18)" stroke-width="0.8" stroke-dasharray="3 2" />

  <!-- 🛏️ BED CAD BLOCK (True Scale to Room) -->
  <g id="bed_unit" filter="url(#drop_shadow_227)">
    <!-- Solid Wood Headboard -->
    <rect x="246" y="82" width="98" height="8" rx="2" fill="#3b271d" stroke="#78350f" stroke-width="1" />
    
    <!-- Reading Lamp Spots -->
    <circle cx="258" cy="86" r="12" fill="url(#lamp_glow_227)" />
    <circle cx="332" cy="86" r="12" fill="url(#lamp_glow_227)" />
    <circle cx="258" cy="86" r="2.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />
    <circle cx="332" cy="86" r="2.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />

    <!-- White Mattress Sheet Base -->
    <rect x="248" y="88" width="94" height="140" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

    <!-- Duvet with Exact Photo Blanket Hex -->
    <rect x="248" y="132" width="94" height="94" rx="3" fill="#f8fafc" stroke="rgba(0,0,0,0.15)" stroke-width="0.8" />
    
    <!-- Turnback Line -->
    <path d="M 248 132 Q 295.0 138 342 132" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Accent Bed Runner -->
    <rect x="248" y="196" width="94" height="24" fill="#334155" opacity="0.88" />
    <line x1="248" y1="196" x2="342" y2="196" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />

    <!-- Dual Hotel Pillows -->
    <rect x="252" y="94" width="40" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <path d="M 258 106 Q 272.0 109 286 106" fill="none" stroke="#cbd5e1" stroke-width="0.8" />
    
    <rect x="298" y="94" width="40" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <path d="M 304 106 Q 318.0 109 332 106" fill="none" stroke="#cbd5e1" stroke-width="0.8" />
  </g>

  <!-- Bedside Nakas -->
  <g filter="url(#drop_shadow_227)">
    <rect x="220" y="90" width="22" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="231" cy="101" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" opacity="0.85" />
    <circle cx="231" cy="101" r="1.5" fill="#d97706" />
  </g>

  <!-- Bedside Nakas -->
  <g filter="url(#drop_shadow_227)">
    <rect x="348" y="90" width="22" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="359" cy="101" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" opacity="0.85" />
    <circle cx="359" cy="101" r="1.5" fill="#d97706" />
  </g>

  <!-- 🚪 WARDROBE (Scaled) -->
  <g id="wardrobe" filter="url(#drop_shadow_227)">
    <rect x="180" y="335" width="78" height="38" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <line x1="186" y1="354.0" x2="252" y2="354.0" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="219.0" y1="335" x2="219.0" y2="373" stroke="#38bdf8" stroke-width="1.2" />
  </g>

  <!-- 🖥️ WORK DESK & ERGONOMIC CHAIR (Scaled) -->
  <g id="desk_setup" filter="url(#drop_shadow_227)">
    <rect x="335" y="335" width="74" height="38" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <!-- Laptop -->
    <rect x="360.0" y="341" width="24" height="15" rx="1.5" fill="#0f172a" stroke="#60a5fa" stroke-width="0.8" />
    <rect x="362.0" y="343" width="20" height="10" rx="1" fill="#38bdf8" opacity="0.65" />
    <!-- Ergonomic Chair -->
    <ellipse cx="372.0" cy="383" rx="11" ry="8" fill="#334155" stroke="#94a3b8" stroke-width="1" />
    <path d="M 362.0 387 Q 372.0 390 382.0 387" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ❄️ AC UNIT -->
  <g id="ac_unit">
    <rect x="266" y="81" width="58" height="10" rx="2" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2" />
    <line x1="271" y1="88" x2="319" y2="88" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="318" cy="85" r="1" fill="#22c55e" />
  </g>

  <!-- 🪟 WINDOW (TOP WALL) -->
  <g id="window_top">
    <rect x="186" y="73" width="77" height="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <line x1="186" y1="76" x2="263" y2="76" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- 🚪 MAIN ENTRANCE DOORWAY -->
  <g id="main_door">
    <rect x="264" y="377" width="60" height="8" fill="#090e17" />
    <path d="M 264 381 A 52 52 0 0 1 316 329" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.75" />
    <line x1="264" y1="381" x2="264" y2="329" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="269" cy="337" r="1.5" fill="#38bdf8" />
  </g>

  <!-- ── SWISS ARCHITECTURAL TITLE BLOCK (CARTOUCHE) ── -->
  <g id="title_block" transform="translate(435, 428)">
    <rect x="0" y="0" width="230" height="40" rx="6" fill="rgba(12, 21, 39, 0.96)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <text x="10" y="14" fill="#f8fafc" font-size="9" font-weight="800" letter-spacing="0.5">
      UNIT 527 • 15.0 m²
    </text>
    <text x="10" y="25" fill="#38bdf8" font-size="7.5" font-weight="700">
      DOUBLE BED (140x200)
    </text>
    <text x="10" y="34" fill="#94a3b8" font-size="6.5" font-weight="500">
      KM LUAR (SHARED) • SKALA 1:50
    </text>
    <!-- Micro CAD Version Seal -->
    <rect x="180" y="7" width="40" height="26" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8" />
    <text x="200" y="18" fill="#38bdf8" font-size="6.5" font-weight="800" text-anchor="middle">CAD</text>
    <text x="200" y="27" fill="#4ade80" font-size="5.8" font-weight="700" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- ── MINIMALIST ARCHITECTURAL COMPASS (NORTH) ── -->
  <g id="north_compass" transform="translate(625, 35)">
    <circle cx="15" cy="15" r="13" fill="rgba(12, 21, 39, 0.9)" stroke="rgba(148, 163, 184, 0.4)" stroke-width="1" />
    <line x1="15" y1="4" x2="15" y2="26" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.75" />
    <line x1="4" y1="15" x2="26" y2="15" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.75" />
    <polygon points="15,6 18,15 15,13 12,15" fill="#38bdf8" />
    <polygon points="15,24 18,15 15,17 12,15" fill="#475569" />
    <text x="15" y="2" fill="#38bdf8" font-size="7" font-weight="900" text-anchor="middle">U</text>
  </g>
</svg>