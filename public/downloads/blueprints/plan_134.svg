  <g>
    <rect x="430" y="60" width="96" height="140" rx="5" fill="#1e293b" stroke="#60a5fa" stroke-width="2.5" />
    <rect x="430" y="54" width="96" height="8" rx="2" fill="#935a26" stroke="#d97706" stroke-width="1.5" />
    <rect x="434" y="64" width="88" height="128" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="434" y="114" width="88" height="80" rx="3" fill="#b0681b" stroke="#774612" stroke-width="1.5" fill-opacity="0.95" />
    <path d="M 434 114 Q 478.0 122 522 114" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <rect x="454.0" y="70" width="48" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <ellipse cx="478.0" cy="112" rx="7" ry="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <text x="478.0" cy="160" fill="#ffffff" font-size="8.5" font-weight="800" text-anchor="middle">SUPER SINGLE</text>
  </g>
  <rect x="398" y="62" width="26" height="28" rx="3" fill="#334155" stroke="#64748b" stroke-width="1.5" />
  <circle cx="411" cy="76" r="5" fill="#f59e0b" opacity="0.75" />

  <!-- Wardrobe -->
  <g>
    <rect x="425" y="278" width="110" height="46" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <line x1="480" y1="278" x2="480" y2="324" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="476" cy="301" r="2" fill="#38bdf8" />
    <circle cx="484" cy="301" r="2" fill="#38bdf8" />
    <text x="480" y="318" fill="#94a3b8" font-size="8" font-weight="700" text-anchor="middle">LEMARI 2 PINTU</text>
  </g>

  <!-- Desk & Chair -->
  <g>
    <rect x="94" y="278" width="105" height="48" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="2" />
    <rect x="130" y="284" width="26" height="16" rx="2" fill="#0f172a" stroke="#60a5fa" stroke-width="1" />
    <rect x="132" y="286" width="22" height="12" fill="#38bdf8" opacity="0.75" />
    <circle cx="112" cy="292" r="4.5" fill="#fbbf24" opacity="0.8" />
    <ellipse cx="144" cy="336" rx="13" ry="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <path d="M 135 342 C 144 345 153 342 153 342" stroke="#60a5fa" stroke-width="2" fill="none" />
    <text x="144" y="316" fill="#cbd5e1" font-size="7.5" font-weight="700" text-anchor="middle">MEJA KERJA</text>
