    <circle cx="254" cy="155" r="9" fill="url(#lamp_glow_162)" />
    <rect x="257" y="120" width="138" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="287" y="122" width="106" height="66" rx="3" fill="#e2e8f0" stroke="rgba(0,0,0,0.18)" stroke-width="0.8" />
    <path d="M 287 122 Q 293 155 287 188" fill="none" stroke="#ffffff" stroke-width="2" />
    <rect x="373" y="122" width="20" height="66" fill="#22d3ee" opacity="0.88" />
    <rect x="261" y="139" width="20" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  </g>

  <g id="wardrobe" filter="url(#drop_shadow_162)">
