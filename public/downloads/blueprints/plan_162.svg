    <line x1="199" y1="157.0" x2="225" y2="157.0" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="212.0" y1="120" x2="212.0" y2="194" stroke="#38bdf8" stroke-width="1.2" />
