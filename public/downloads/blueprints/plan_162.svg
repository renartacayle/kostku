<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%" style="background:#090e17; border-radius:14px; font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid_cad_162" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(148, 163, 184, 0.04)" stroke-width="0.75" />
    </pattern>
    <pattern id="grid_major_162" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
    </pattern>
    <pattern id="parquet_162" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#295679" fill-opacity="0.34" />
      <path d="M 0 10 L 40 10 M 20 0 L 20 10 M 0 20 L 40 20 M 40 10 L 40 20 M 0 0 L 0 10" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.6" />
    </pattern>
    <pattern id="bm_tile_162" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#0f2338" />
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="0.6" />
    </pattern>
    <filter id="frost_blur_162" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4.2" result="blur" />
    </filter>
    <pattern id="blind_hatch_162" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.2" stroke-dasharray="2 2" />
    </pattern>
    <radialGradient id="lamp_glow_162">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="camera_frustum_162" cx="0%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </radialGradient>
    <filter id="drop_shadow_162" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="680" height="480" fill="#090e17" />
  <rect width="680" height="480" fill="url(#grid_cad_162)" />
  <rect width="680" height="480" fill="url(#grid_major_162)" />

  <g stroke="rgba(148, 163, 184, 0.35)" stroke-width="1">
    <path d="M 14 20 L 20 20 M 20 14 L 20 20" />
    <path d="M 666 20 L 660 20 M 660 14 L 660 20" />
    <path d="M 14 460 L 20 460 M 20 466 L 20 460" />
    <path d="M 666 460 L 660 460 M 660 466 L 660 460" />
  </g>

  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="186" y1="94" x2="403" y2="94" opacity="0.85" />
    <line x1="181" y1="99" x2="191" y2="89" stroke-width="1.8" />
    <line x1="398" y1="99" x2="408" y2="89" stroke-width="1.8" />
    <line x1="186" y1="106" x2="186" y2="86" opacity="0.4" stroke-width="0.75" />
    <line x1="403" y1="106" x2="403" y2="86" opacity="0.4" stroke-width="0.75" />
    <rect x="252.5" y="82" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
