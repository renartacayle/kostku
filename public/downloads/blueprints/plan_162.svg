    <rect x="192" y="270" width="61" height="65" rx="5" fill="url(#blind_hatch_162)" stroke="rgba(244, 63, 94, 0.45)" stroke-width="1" stroke-dasharray="3 2" />
    <rect x="196" y="290" width="53" height="24" rx="4" fill="rgba(15, 23, 42, 0.94)" stroke="rgba(244, 63, 94, 0.5)" stroke-width="0.8" />
