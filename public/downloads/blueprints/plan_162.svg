    <path d="M 265 343 A 51 51 0 0 1 316 292" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.75" />
    <line x1="265" y1="343" x2="265" y2="292" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="270" cy="299" r="1.5" fill="#38bdf8" />
