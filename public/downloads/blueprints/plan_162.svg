    <line x1="295" y1="357" x2="234.5" y2="153.3" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="295" y1="357" x2="412.1" y2="179.7" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />
