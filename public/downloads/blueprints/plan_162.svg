    <circle cx="325" cy="155" r="3" fill="#38bdf8" opacity="0.85" />
    <circle cx="325" cy="155" r="6.5" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />

