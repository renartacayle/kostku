    <line x1="163" y1="117" x2="173" y2="107" stroke-width="1.8" />
    <line x1="163" y1="348" x2="173" y2="338" stroke-width="1.8" />
    <line x1="180" y1="112" x2="160" y2="112" opacity="0.4" stroke-width="0.75" />
    <line x1="180" y1="343" x2="160" y2="343" opacity="0.4" stroke-width="0.75" />
    <g transform="translate(168, 227.5)">
