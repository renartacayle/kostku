<g id="tv_shelf"><rect x="359" y="131" width="30" height="44" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1.2" /><rect x="367" y="141" width="14" height="24" rx="1.5" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" /></g>
