      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="camera_frustum_410" cx="0%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </radialGradient>
    <filter id="drop_shadow_410" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
