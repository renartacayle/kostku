    <rect x="390" y="95" width="146" height="150" rx="6" fill="rgba(56, 189, 248, 0.05)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="463.0" y="239" fill="rgba(148, 163, 184, 0.55)" font-size="6.5" font-weight="600" text-anchor="middle">KARPET AREA</text>
  </g>

  <!-- Bed Unit (Visual Twin Extracted with 100% Precision) -->
  <g>
    <rect x="400" y="60" width="126" height="140" rx="5" fill="#1e293b" stroke="#60a5fa" stroke-width="2.5" />
    <rect x="400" y="54" width="126" height="8" rx="2" fill="#935a26" stroke="#d97706" stroke-width="1.5" />
    <rect x="404" y="64" width="118" height="128" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="404" y="114" width="118" height="80" rx="3" fill="#38bdf8" stroke="#0369a1" stroke-width="1.5" fill-opacity="0.95" />
    <path d="M 404 114 Q 463.0 122 522 114" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <rect x="406" y="70" width="44" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="476" y="70" width="44" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <ellipse cx="463.0" cy="112" rx="7" ry="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <text x="463.0" cy="160" fill="#ffffff" font-size="8" font-weight="800" text-anchor="middle">QUEEN BED (160x200)</text>
  </g>
  <rect x="368" y="62" width="26" height="28" rx="3" fill="#334155" stroke="#64748b" stroke-width="1.5" />
  <circle cx="381" cy="76" r="5" fill="#f59e0b" opacity="0.75" />

  <!-- Wardrobe -->
  <g>
    <rect x="425" y="278" width="110" height="46" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <line x1="480" y1="278" x2="480" y2="324" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="476" cy="301" r="2" fill="#38bdf8" />
    <circle cx="484" cy="301" r="2" fill="#38bdf8" />
    <text x="480" y="318" fill="#94a3b8" font-size="8" font-weight="700" text-anchor="middle">LEMARI 2 PINTU</text>
  </g>

  <!-- Desk & Chair -->
  <g>
    <rect x="94" y="260" width="105" height="48" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="2" />
    <rect x="130" y="266" width="26" height="16" rx="2" fill="#0f172a" stroke="#60a5fa" stroke-width="1" />
    <rect x="132" y="268" width="22" height="12" fill="#38bdf8" opacity="0.75" />
    <circle cx="112" cy="274" r="4.5" fill="#fbbf24" opacity="0.8" />
    <ellipse cx="144" cy="318" rx="13" ry="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <path d="M 135 324 C 144 327 153 324 153 324" stroke="#60a5fa" stroke-width="2" fill="none" />
    <text x="144" y="298" fill="#cbd5e1" font-size="7.5" font-weight="700" text-anchor="middle">MEJA KERJA</text>
  </g>

  <!-- AC Unit -->
  <g>
    <rect x="250" y="52" width="68" height="13" rx="2" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
    <path d="M 258 65 L 254 74" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />
    <path d="M 284 65 L 284 76" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />
    <path d="M 310 65 L 314 74" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />
    <text x="284" y="61" fill="#0284c7" font-size="7" font-weight="800" text-anchor="middle">AC 1 PK</text>
  </g>

  <!-- Mini Fridge -->
  <g>
    <rect x="220" y="286" width="34" height="36" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="226" cy="304" r="2" fill="#38bdf8" />
    <text x="237" y="316" fill="#94a3b8" font-size="6.5" font-weight="700" text-anchor="middle">KULKAS</text>
  </g>

  <!-- Window on Left Wall -->
  <g>
    <rect x="76" y="160" width="8" height="60" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
    <line x1="80" y1="160" x2="80" y2="220" stroke="#ffffff" stroke-width="1.5" />
    <text x="70" y="192" fill="#38bdf8" font-size="7.5" font-weight="700" text-anchor="middle" transform="rotate(-90 70 192)">JENDELA</text>
  </g>

  <!-- Door -->
  <g>
    <rect x="280" y="342" width="50" height="16" fill="#0f1d38" />
    <path d="M 280 346 A 44 44 0 0 1 324 302" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="280" y1="346" x2="280" y2="302" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
    <text x="305" y="364" fill="#38bdf8" font-size="8" font-weight="800" text-anchor="middle">PINTU</text>
  </g>

  <!-- Title Stamp & AI CV Detection Badge -->
  <g>
    <rect x="200" y="165" width="220" height="58" rx="8" fill="rgba(15, 23, 42, 0.94)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" />
    <text x="310" y="182" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">KAMAR 643</text>
    <text x="310" y="196" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">LUAS: 21.5 m² (4.3x5.0m) • KM DALAM (ENSUITE)</text>
    <text x="310" y="210" fill="#4ade80" font-size="7" font-weight="700" text-anchor="middle">AI: QUEEN BED (160x200) • KASUR RIGHT</text>
  </g>

  <!-- Compass -->
  <g transform="translate(562, 312)">
    <circle cx="15" cy="15" r="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <path d="M 15 5 L 20 15 L 15 12 L 10 15 Z" fill="#ef4444" />
    <path d="M 15 25 L 20 15 L 15 18 L 10 15 Z" fill="#94a3b8" />
    <text x="15" y="4" fill="#ef4444" font-size="7.5" font-weight="800" text-anchor="middle">U</text>
  </g>
