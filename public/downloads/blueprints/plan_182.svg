    <rect x="257" y="124" width="138" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="287" y="126" width="106" height="66" rx="3" fill="#e2e8f0" stroke="rgba(0,0,0,0.18)" stroke-width="0.8" />
