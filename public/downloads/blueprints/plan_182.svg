  <rect x="186" y="116" width="217" height="224" fill="none" stroke="rgba(0, 0, 0, 0.38)" stroke-width="5" />
  <rect x="181" y="111" width="227" height="234" fill="none" stroke="#1e293b" stroke-width="8" rx="2" />
  <rect x="177" y="107" width="235" height="242" fill="none" stroke="#475569" stroke-width="1" rx="3" />
  <rect x="185" y="115" width="219" height="226" fill="none" stroke="#64748b" stroke-width="1" rx="1" />

