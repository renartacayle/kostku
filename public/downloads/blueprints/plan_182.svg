    <path d="M 14 460 L 20 460 M 20 466 L 20 460" />
    <path d="M 666 460 L 660 460 M 660 466 L 660 460" />
  </g>

  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="186" y1="98" x2="403" y2="98" opacity="0.85" />
    <line x1="181" y1="103" x2="191" y2="93" stroke-width="1.8" />
    <line x1="398" y1="103" x2="408" y2="93" stroke-width="1.8" />
    <line x1="186" y1="110" x2="186" y2="90" opacity="0.4" stroke-width="0.75" />
    <line x1="403" y1="110" x2="403" y2="90" opacity="0.4" stroke-width="0.75" />
