    <line x1="163" y1="345" x2="173" y2="335" stroke-width="1.8" />
    <line x1="180" y1="116" x2="160" y2="116" opacity="0.4" stroke-width="0.75" />
    <line x1="180" y1="340" x2="160" y2="340" opacity="0.4" stroke-width="0.75" />
