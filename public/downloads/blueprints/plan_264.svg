    </text>
  </g>

  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="165" y1="92" x2="165" y2="365" opacity="0.85" />
    <line x1="160" y1="97" x2="170" y2="87" stroke-width="1.8" />
    <line x1="160" y1="370" x2="170" y2="360" stroke-width="1.8" />
    <line x1="177" y1="92" x2="157" y2="92" opacity="0.4" stroke-width="0.75" />
    <line x1="177" y1="365" x2="157" y2="365" opacity="0.4" stroke-width="0.75" />
    <g transform="translate(165, 228.5)">
      <rect x="-42" y="-10" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" transform="rotate(-90)" />
      <text x="0" y="4" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5" transform="rotate(-90)" stroke="none">
        3.90 m
      </text>
    </g>
  </g>

  <rect x="183" y="92" width="224" height="273" rx="2" fill="url(#parquet_264)" />
  <rect x="183" y="92" width="224" height="273" fill="none" stroke="rgba(0, 0, 0, 0.38)" stroke-width="5" />
  <rect x="178" y="87" width="234" height="283" fill="none" stroke="#1e293b" stroke-width="8" rx="2" />
  <rect x="174" y="83" width="242" height="291" fill="none" stroke="#475569" stroke-width="1" rx="3" />
  <rect x="182" y="91" width="226" height="275" fill="none" stroke="#64748b" stroke-width="1" rx="1" />

  <g id="camera_frustum_cone" opacity="0.85">
    <polygon points="296,379 188.8,151.9 401.1,150.9" fill="url(#camera_frustum_264)" />
    <line x1="296" y1="379" x2="188.8" y2="151.9" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="296" y1="379" x2="401.1" y2="150.9" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />
  </g>

  <g id="unsure_zone" opacity="0.95">
