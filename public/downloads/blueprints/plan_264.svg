    <rect x="337" y="291" width="64" height="66" rx="5" fill="url(#blind_hatch_264)" stroke="rgba(244, 63, 94, 0.45)" stroke-width="1" stroke-dasharray="3 2" />
    <rect x="341" y="312" width="56" height="24" rx="4" fill="rgba(15, 23, 42, 0.94)" stroke="rgba(244, 63, 94, 0.5)" stroke-width="0.8" />
    <text x="369.0" y="322" fill="#fda4af" font-size="6.8" font-weight="700" text-anchor="middle">BLIND SPOT</text>
    <text x="369.0" y="331" fill="#94a3b8" font-size="5.3" font-weight="500" text-anchor="middle">Luar Sudut Kamera</text>
