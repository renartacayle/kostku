  <rect x="238" y="120" width="114" height="148" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(148, 163, 184, 0.18)" stroke-width="0.8" stroke-dasharray="3 2" />

  <g id="bed_unit" filter="url(#drop_shadow_264)">
    <rect x="246" y="95" width="98" height="7" rx="2" fill="#3b271d" stroke="#78350f" stroke-width="1" />
    <circle cx="258" cy="99" r="10" fill="url(#lamp_glow_264)" />
    <circle cx="332" cy="99" r="10" fill="url(#lamp_glow_264)" />
    <rect x="248" y="100" width="94" height="140" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="248" y="138" width="94" height="100" rx="3" fill="#e5e7eb" stroke="rgba(0,0,0,0.18)" stroke-width="0.8" />
    <path d="M 248 138 Q 295.0 144 342 138" fill="none" stroke="#ffffff" stroke-width="2" />
    <rect x="248" y="212" width="94" height="20" fill="#1e3a8a" opacity="0.88" />
    <rect x="252" y="106" width="38" height="22" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" /><rect x="300" y="106" width="38" height="22" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  </g>

  <g filter="url(#drop_shadow_264)">
