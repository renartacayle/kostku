<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%" style="background:#090e17; border-radius:14px; font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Architectural Fine Grid (16px) -->
    <pattern id="grid_cad_153" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(148, 163, 184, 0.04)" stroke-width="0.75" />
    </pattern>
    <!-- Architectural Major Module Grid (80px) -->
    <pattern id="grid_major_153" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
    </pattern>
    <!-- Luxury Parquet Wood Floor Pattern -->
    <pattern id="parquet_153" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#78350f" fill-opacity="0.32" />
      <path d="M 0 10 L 40 10 M 20 0 L 20 10 M 0 20 L 40 20 M 40 10 L 40 20 M 0 0 L 0 10" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.6" />
    </pattern>
    <!-- Bathroom Ceramic Micro-Tile Pattern -->
    <pattern id="bm_tile_153" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#0f2338" />
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="0.6" />
    </pattern>
    <!-- Frosted Glass Blur Filter for Camera Blind Spot -->
    <filter id="frost_blur_153" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
    </filter>
    <!-- Architectural 45-deg Hatch for Blind Spot -->
    <pattern id="blind_hatch_153" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.2" stroke-dasharray="2 2" />
    </pattern>
    <!-- Reading Lamp Warm Radial Glow -->
    <radialGradient id="lamp_glow_153">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="drop_shadow_153" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background CAD Drafting Paper -->
  <rect width="680" height="480" fill="#090e17" />
  <rect width="680" height="480" fill="url(#grid_cad_153)" />
  <rect width="680" height="480" fill="url(#grid_major_153)" />

  <!-- Sheet Crop Registration Marks (Architectural Standard) -->
  <g stroke="rgba(148, 163, 184, 0.35)" stroke-width="1">
    <path d="M 14 20 L 20 20 M 20 14 L 20 20" />
    <path d="M 666 20 L 660 20 M 660 14 L 660 20" />
    <path d="M 14 460 L 20 460 M 20 466 L 20 460" />
    <path d="M 666 460 L 660 460 M 660 466 L 660 460" />
  </g>

  <!-- ── DIMENSION LINES (PROPORTIONAL 45° ARCHITECTURAL TICKS) ── -->
  <!-- Top Horizontal Dimension (Width) -->
  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="152" y1="34" x2="439" y2="34" opacity="0.85" />
    <line x1="147" y1="39" x2="157" y2="29" stroke-width="1.8" />
    <line x1="434" y1="39" x2="444" y2="29" stroke-width="1.8" />
    <line x1="152" y1="46" x2="152" y2="26" opacity="0.4" stroke-width="0.75" />
    <line x1="439" y1="46" x2="439" y2="26" opacity="0.4" stroke-width="0.75" />
    <rect x="253.5" y="22" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="295.5" y="36" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      4.10 m
    </text>
  </g>

  <!-- Left Vertical Dimension (Length) -->
  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="134" y1="52" x2="134" y2="409" opacity="0.85" />
    <line x1="129" y1="57" x2="139" y2="47" stroke-width="1.8" />
    <line x1="129" y1="414" x2="139" y2="404" stroke-width="1.8" />
    <line x1="146" y1="52" x2="126" y2="52" opacity="0.4" stroke-width="0.75" />
    <line x1="146" y1="409" x2="126" y2="409" opacity="0.4" stroke-width="0.75" />
    <g transform="translate(134, 230.5)">
      <rect x="-42" y="-10" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" transform="rotate(-90)" />
      <text x="0" y="4" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5" transform="rotate(-90)">
        5.10 m
      </text>
    </g>
  </g>

  <!-- ── DYNAMICALLY PROPORTIONAL ROOM FLOOR ── -->
  <rect x="152" y="52" width="287" height="357" rx="2" fill="url(#parquet_153)" />
  <rect x="152" y="52" width="287" height="357" fill="none" stroke="rgba(0, 0, 0, 0.38)" stroke-width="5" />

  <!-- ── ARCHITECTURAL CAVITY WALLS (PROPORTIONAL DOUBLE LINE) ── -->
  <rect x="147" y="47" width="297" height="367" fill="none" stroke="#1e293b" stroke-width="8" rx="2" />
  <rect x="143" y="43" width="305" height="375" fill="none" stroke="#475569" stroke-width="1" rx="3" />
  <rect x="151" y="51" width="289" height="359" fill="none" stroke="#64748b" stroke-width="1" rx="1" />

  <!-- 🚿 ENSUITE BATHROOM COMPARTMENT -->
  <g id="ensuite_bathroom" filter="url(#drop_shadow_153)">
    <rect x="152" y="52" width="105" height="116" fill="url(#bm_tile_153)" stroke="#334155" stroke-width="4" />
    <rect x="152" y="52" width="105" height="116" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    
    <!-- Walk-in Shower Screen -->
    <rect x="209" y="58" width="42" height="42" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="230" cy="79" r="7" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <circle cx="230" cy="79" r="2.5" fill="#38bdf8" />

    <!-- Toilet (WC) -->
    <rect x="158" y="58" width="26" height="10" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="0.8" />
    <path d="M 160 68 C 160 88 182 88 182 68 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />

    <!-- Floating Vanity Basin -->
    <rect x="158" y="136" width="36" height="26" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <rect x="163" y="140" width="26" height="18" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />
    <circle cx="166" cy="149" r="2" fill="#38bdf8" />

    <!-- Bathroom Door Swing -->
    <rect x="225" y="166" width="30" height="4" fill="#090e17" />
    <path d="M 227 168 A 26 26 0 0 0 253 142" fill="none" stroke="#38bdf8" stroke-width="0.9" stroke-dasharray="2 2" opacity="0.75" />
    <line x1="227" y1="168" x2="253" y2="168" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Area Rug -->
  <rect x="284" y="85" width="128" height="150" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(148, 163, 184, 0.18)" stroke-width="0.8" stroke-dasharray="3 2" />

  <!-- 🛏️ BED CAD BLOCK (True Scale to Room) -->
  <g id="bed_unit" filter="url(#drop_shadow_153)">
    <!-- Solid Wood Headboard -->
    <rect x="292" y="54" width="112" height="8" rx="2" fill="#3b271d" stroke="#78350f" stroke-width="1" />
    
    <!-- Reading Lamp Spots -->
    <circle cx="304" cy="58" r="12" fill="url(#lamp_glow_153)" />
    <circle cx="392" cy="58" r="12" fill="url(#lamp_glow_153)" />
    <circle cx="304" cy="58" r="2.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />
    <circle cx="392" cy="58" r="2.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />

    <!-- White Mattress Sheet Base -->
    <rect x="294" y="60" width="108" height="140" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

    <!-- Duvet with Exact Photo Blanket Hex -->
    <rect x="294" y="104" width="108" height="94" rx="3" fill="#38bdf8" stroke="rgba(0,0,0,0.15)" stroke-width="0.8" />
    
    <!-- Turnback Line -->
    <path d="M 294 104 Q 348.0 110 402 104" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Accent Bed Runner -->
    <rect x="294" y="168" width="108" height="24" fill="#0369a1" opacity="0.88" />
    <line x1="294" y1="168" x2="402" y2="168" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />

    <!-- Dual Hotel Pillows -->
    <rect x="298" y="66" width="42" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <path d="M 304 78 Q 319.0 81 334 78" fill="none" stroke="#cbd5e1" stroke-width="0.8" />
    
    <rect x="356" y="66" width="42" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <path d="M 362 78 Q 377.0 81 392 78" fill="none" stroke="#cbd5e1" stroke-width="0.8" />
  </g>

  <!-- Bedside Nakas -->
  <g filter="url(#drop_shadow_153)">
    <rect x="264" y="62" width="22" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="275" cy="73" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" opacity="0.85" />
    <circle cx="275" cy="73" r="1.5" fill="#d97706" />
  </g>

  <!-- Bedside Nakas -->
  <g filter="url(#drop_shadow_153)">
    <rect x="410" y="62" width="22" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="421" cy="73" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" opacity="0.85" />
    <circle cx="421" cy="73" r="1.5" fill="#d97706" />
  </g>

  <!-- 🚪 WARDROBE (Scaled) -->
  <g id="wardrobe" filter="url(#drop_shadow_153)">
    <rect x="351" y="363" width="80" height="38" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <line x1="357" y1="382.0" x2="425" y2="382.0" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="391.0" y1="363" x2="391.0" y2="401" stroke="#38bdf8" stroke-width="1.2" />
  </g>

  <!-- 🖥️ WORK DESK & ERGONOMIC CHAIR (Scaled) -->
  <g id="desk_setup" filter="url(#drop_shadow_153)">
    <rect x="160" y="363" width="74" height="38" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <!-- Laptop -->
    <rect x="185.0" y="369" width="24" height="15" rx="1.5" fill="#0f172a" stroke="#60a5fa" stroke-width="0.8" />
    <rect x="187.0" y="371" width="20" height="10" rx="1" fill="#38bdf8" opacity="0.65" />
    <!-- Ergonomic Chair -->
    <ellipse cx="197.0" cy="411" rx="11" ry="8" fill="#334155" stroke="#94a3b8" stroke-width="1" />
    <path d="M 187.0 415 Q 197.0 418 207.0 415" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ❄️ AC UNIT -->
  <g id="ac_unit">
    <rect x="319" y="53" width="58" height="10" rx="2" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2" />
    <line x1="324" y1="60" x2="372" y2="60" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="371" cy="57" r="1" fill="#22c55e" />
  </g>

  <!-- 🧊 MINI FRIDGE -->
  <g id="fridge" filter="url(#drop_shadow_153)">
    <rect x="160" y="178" width="35" height="35" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <line x1="191" y1="184" x2="191" y2="207" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- 🪟 WINDOW (LEFT WALL) -->
  <g id="window_left">
    <rect x="145" y="192" width="6" height="77" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <line x1="148" y1="192" x2="148" y2="268" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- 🚪 MAIN ENTRANCE DOORWAY -->
  <g id="main_door">
    <rect x="266" y="405" width="60" height="8" fill="#090e17" />
    <path d="M 266 409 A 52 52 0 0 1 318 357" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.75" />
    <line x1="266" y1="409" x2="266" y2="357" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="271" cy="365" r="1.5" fill="#38bdf8" />
  </g>

  <!-- ── SWISS ARCHITECTURAL TITLE BLOCK (CARTOUCHE) ── -->
  <g id="title_block" transform="translate(435, 428)">
    <rect x="0" y="0" width="230" height="40" rx="6" fill="rgba(12, 21, 39, 0.96)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <text x="10" y="14" fill="#f8fafc" font-size="9" font-weight="800" letter-spacing="0.5">
      UNIT 403 • 20.9 m²
    </text>
    <text x="10" y="25" fill="#38bdf8" font-size="7.5" font-weight="700">
      QUEEN BED (160x200)
    </text>
    <text x="10" y="34" fill="#94a3b8" font-size="6.5" font-weight="500">
      KM DALAM (ENSUITE) • SKALA 1:50
    </text>
    <!-- Micro CAD Version Seal -->
    <rect x="180" y="7" width="40" height="26" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8" />
    <text x="200" y="18" fill="#38bdf8" font-size="6.5" font-weight="800" text-anchor="middle">CAD</text>
    <text x="200" y="27" fill="#4ade80" font-size="5.8" font-weight="700" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- ── MINIMALIST ARCHITECTURAL COMPASS (NORTH) ── -->
  <g id="north_compass" transform="translate(625, 35)">
    <circle cx="15" cy="15" r="13" fill="rgba(12, 21, 39, 0.9)" stroke="rgba(148, 163, 184, 0.4)" stroke-width="1" />
    <line x1="15" y1="4" x2="15" y2="26" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.75" />
    <line x1="4" y1="15" x2="26" y2="15" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.75" />
    <polygon points="15,6 18,15 15,13 12,15" fill="#38bdf8" />
    <polygon points="15,24 18,15 15,17 12,15" fill="#475569" />
    <text x="15" y="2" fill="#38bdf8" font-size="7" font-weight="900" text-anchor="middle">U</text>
  </g>
</svg>