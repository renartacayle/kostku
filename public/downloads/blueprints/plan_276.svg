<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%" style="background:#090e17; border-radius:14px; font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Architectural Fine Grid (16px) -->
    <pattern id="grid_cad_276" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(148, 163, 184, 0.04)" stroke-width="0.75" />
    </pattern>
    <!-- Architectural Major Module Grid (80px) -->
    <pattern id="grid_major_276" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
    </pattern>
    <!-- Luxury Parquet Wood Floor Pattern -->
    <pattern id="parquet_276" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#fef08a" fill-opacity="0.32" />
      <path d="M 0 10 L 40 10 M 20 0 L 20 10 M 0 20 L 40 20 M 40 10 L 40 20 M 0 0 L 0 10" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.6" />
    </pattern>
    <!-- Bathroom Ceramic Micro-Tile Pattern -->
    <pattern id="bm_tile_276" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#0f2338" />
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="0.6" />
    </pattern>
    <!-- Frosted Glass Blur Filter for Camera Blind Spot -->
    <filter id="frost_blur_276" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
    </filter>
    <!-- Architectural 45-deg Hatch for Blind Spot -->
    <pattern id="blind_hatch_276" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.2" stroke-dasharray="2 2" />
    </pattern>
    <!-- Reading Lamp Warm Radial Glow -->
    <radialGradient id="lamp_glow_276">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>
    <!-- Camera View Frustum Cone Gradient -->
    <radialGradient id="camera_frustum_276" cx="0%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="drop_shadow_276" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background CAD Drafting Paper -->
  <rect width="680" height="480" fill="#090e17" />
  <rect width="680" height="480" fill="url(#grid_cad_276)" />
  <rect width="680" height="480" fill="url(#grid_major_276)" />

  <!-- Sheet Crop Registration Marks (Architectural Standard) -->
  <g stroke="rgba(148, 163, 184, 0.35)" stroke-width="1">
    <path d="M 14 20 L 20 20 M 20 14 L 20 20" />
    <path d="M 666 20 L 660 20 M 660 14 L 660 20" />
    <path d="M 14 460 L 20 460 M 20 466 L 20 460" />
    <path d="M 666 460 L 660 460 M 660 466 L 660 460" />
  </g>

  <!-- ── DIMENSION LINES (PROPORTIONAL 45° ARCHITECTURAL TICKS) ── -->
  <!-- Top Horizontal Dimension (Width) -->
  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="127" y1="30" x2="463" y2="30" opacity="0.85" />
    <line x1="122" y1="35" x2="132" y2="25" stroke-width="1.8" />
    <line x1="458" y1="35" x2="468" y2="25" stroke-width="1.8" />
    <line x1="127" y1="42" x2="127" y2="22" opacity="0.4" stroke-width="0.75" />
    <line x1="463" y1="42" x2="463" y2="22" opacity="0.4" stroke-width="0.75" />
    <rect x="253.0" y="18" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="295.0" y="32" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      4.80 m
    </text>
  </g>

  <!-- Left Vertical Dimension (Length) -->
  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="109" y1="48" x2="109" y2="412" opacity="0.85" />
    <line x1="104" y1="53" x2="114" y2="43" stroke-width="1.8" />
    <line x1="104" y1="417" x2="114" y2="407" stroke-width="1.8" />
    <line x1="121" y1="48" x2="101" y2="48" opacity="0.4" stroke-width="0.75" />
    <line x1="121" y1="412" x2="101" y2="412" opacity="0.4" stroke-width="0.75" />
    <g transform="translate(109, 230.0)">
      <rect x="-42" y="-10" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" transform="rotate(-90)" />
      <text x="0" y="4" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5" transform="rotate(-90)">
        5.20 m
      </text>
    </g>
  </g>

  <!-- ── DYNAMICALLY PROPORTIONAL ROOM FLOOR ── -->
  <rect x="127" y="48" width="336" height="364" rx="2" fill="url(#parquet_276)" />
  <rect x="127" y="48" width="336" height="364" fill="none" stroke="rgba(0, 0, 0, 0.38)" stroke-width="5" />

  <!-- ── ARCHITECTURAL CAVITY WALLS (PROPORTIONAL DOUBLE LINE) ── -->
  <rect x="122" y="43" width="346" height="374" fill="none" stroke="#1e293b" stroke-width="8" rx="2" />
  <rect x="118" y="39" width="354" height="382" fill="none" stroke="#475569" stroke-width="1" rx="3" />
  <rect x="126" y="47" width="338" height="366" fill="none" stroke="#64748b" stroke-width="1" rx="1" />

  <!-- 📷 ARCHITECTURAL CAMERA VIEW FRUSTUM (Perspective Distortion Visualizer) -->
  <g id="camera_frustum_cone" opacity="0.85">
    <polygon points="295,426 288.7,155.4 504.4,254.4" fill="url(#camera_frustum_276)" />
    <line x1="295" y1="426" x2="288.7" y2="155.4" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="295" y1="426" x2="504.4" y2="254.4" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />
  </g>

  <!-- 🚿 ENSUITE BATHROOM COMPARTMENT -->
  <g id="ensuite_bathroom" filter="url(#drop_shadow_276)">
    <rect x="127" y="48" width="105" height="116" fill="url(#bm_tile_276)" stroke="#334155" stroke-width="4" />
    <rect x="127" y="48" width="105" height="116" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    
    <!-- Walk-in Shower Screen -->
    <rect x="184" y="54" width="42" height="42" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="205" cy="75" r="7" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <circle cx="205" cy="75" r="2.5" fill="#38bdf8" />

    <!-- Toilet (WC) -->
    <rect x="133" y="54" width="26" height="10" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="0.8" />
    <path d="M 135 64 C 135 84 157 84 157 64 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />

    <!-- Floating Vanity Basin -->
    <rect x="133" y="132" width="36" height="26" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <rect x="138" y="136" width="26" height="18" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />
    <circle cx="141" cy="145" r="2" fill="#38bdf8" />

    <!-- Bathroom Door Swing -->
    <rect x="200" y="162" width="30" height="4" fill="#090e17" />
    <path d="M 202 164 A 26 26 0 0 0 228 138" fill="none" stroke="#38bdf8" stroke-width="0.9" stroke-dasharray="2 2" opacity="0.75" />
    <line x1="202" y1="164" x2="228" y2="164" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Area Rug -->
  <rect x="289" y="159" width="168" height="142" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(148, 163, 184, 0.18)" stroke-width="0.8" stroke-dasharray="3 2" />

  <!-- 🛏️ BED CAD BLOCK (King Suite Bed along Right Wall) -->
  <g id="bed_unit" filter="url(#drop_shadow_276)">
    <!-- Solid Wood Headboard on Right Wall -->
    <rect x="457" y="167" width="8" height="126" rx="2" fill="#3b271d" stroke="#78350f" stroke-width="1" />
    <circle cx="461" cy="185" r="12" fill="url(#lamp_glow_276)" />
    <circle cx="461" cy="275" r="12" fill="url(#lamp_glow_276)" />
    <circle cx="461" cy="185" r="2.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />
    <circle cx="461" cy="275" r="2.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />

    <!-- White Mattress Sheet Base -->
    <rect x="315" y="169" width="138" height="122" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

    <!-- Duvet with Exact Photo Blanket Hex (extending from foot on west) -->
    <rect x="317" y="171" width="98" height="118" rx="3" fill="#fef9c3" stroke="rgba(0,0,0,0.15)" stroke-width="0.8" />
    
    <!-- Turnback Line -->
    <path d="M 413 171 Q 407 230 413 289" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Accent Bed Runner at Foot (West) -->
    <rect x="321" y="171" width="22" height="118" fill="#ca8a04" opacity="0.88" />
    <line x1="343" y1="171" x2="343" y2="289" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />

    <!-- Dual Hotel Pillows against Right Wall -->
    <rect x="425" y="177" width="22" height="42" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <path d="M 436 183 Q 439 198.0 436 213" fill="none" stroke="#cbd5e1" stroke-width="0.8" />

    <rect x="425" y="241" width="22" height="42" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <path d="M 436 247 Q 439 262.0 436 277" fill="none" stroke="#cbd5e1" stroke-width="0.8" />

    
    <!-- Upholstered Foot Bench -->
    <rect x="295" y="181" width="14" height="98" rx="3" fill="#1e3a8a" stroke="#d97706" stroke-width="1" />
    <line x1="302" y1="187" x2="302" y2="273" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="2 2" />

  </g>

  <!-- Bedside Nakas -->
  <g filter="url(#drop_shadow_276)">
    <rect x="435" y="141" width="22" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="446" cy="152" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" opacity="0.85" />
    <circle cx="446" cy="152" r="1.5" fill="#d97706" />
  </g>

  <!-- Bedside Nakas -->
  <g filter="url(#drop_shadow_276)">
    <rect x="435" y="297" width="22" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="446" cy="308" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" opacity="0.85" />
    <circle cx="446" cy="308" r="1.5" fill="#d97706" />
  </g>

  <!-- 🚪 WARDROBE (Scaled) -->
  <g id="wardrobe" filter="url(#drop_shadow_276)">
    <rect x="135" y="366" width="80" height="38" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <line x1="141" y1="385.0" x2="209" y2="385.0" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="175.0" y1="366" x2="175.0" y2="404" stroke="#38bdf8" stroke-width="1.2" />
  </g>

  <!-- 🖥️ WORK DESK & ERGONOMIC CHAIR (Scaled) -->
  <g id="desk_setup" filter="url(#drop_shadow_276)">
    <rect x="135" y="180" width="38" height="74" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <!-- Laptop -->
    <rect x="142.0" y="186" width="24" height="15" rx="1.5" fill="#0f172a" stroke="#60a5fa" stroke-width="0.8" />
    <rect x="144.0" y="188" width="20" height="10" rx="1" fill="#38bdf8" opacity="0.65" />
    
    <!-- Ergonomic Chair (facing desk on left wall) -->
    <ellipse cx="184" cy="217" rx="8" ry="11" fill="#334155" stroke="#94a3b8" stroke-width="1" />
    <path d="M 188 207 Q 191 217 188 227" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  </g>

  <!-- ❄️ AC UNIT -->
  <g id="ac_unit">
    <rect x="356" y="49" width="58" height="10" rx="2" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2" />
    <line x1="361" y1="56" x2="409" y2="56" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="408" cy="53" r="1" fill="#22c55e" />
  </g>

  <!-- 🧊 MINI FRIDGE -->
  <g id="fridge" filter="url(#drop_shadow_276)">
    <rect x="135" y="264" width="35" height="35" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <line x1="166" y1="270" x2="166" y2="293" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- 🪟 WINDOW (LEFT WALL) -->
  <g id="window_left">
    <rect x="120" y="192" width="6" height="77" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <line x1="123" y1="192" x2="123" y2="268" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- 🚪 MAIN ENTRANCE DOORWAY -->
  <g id="main_door">
    <rect x="265" y="408" width="60" height="8" fill="#090e17" />
    <path d="M 265 412 A 52 52 0 0 1 317 360" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.75" />
    <line x1="265" y1="412" x2="265" y2="360" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="270" cy="368" r="1.5" fill="#38bdf8" />
  </g>

  <!-- 📷 CAMERA SIGHTLINE RAY & PERSPECTIVE BADGE -->
  <g id="camera_marker_overlay">
    <!-- Central Sightline Ray from Camera to Bed Center -->
    <line x1="295" y1="426" x2="385" y2="230" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.85" />
    <circle cx="385" cy="230" r="3" fill="#38bdf8" opacity="0.85" />
    <circle cx="385" cy="230" r="6.5" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />

    <!-- Camera Icon Glyph -->
    <g transform="translate(295, 426) rotate(24.663814712463562)">
      <rect x="-9" y="-6" width="18" height="12" rx="2.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      <path d="M -3 -6 L -1.5 -8.5 L 1.5 -8.5 L 3 -6 Z" fill="#38bdf8" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" stroke="#ffffff" stroke-width="0.9" />
      <circle cx="0" cy="0" r="1.8" fill="#38bdf8" />
      <polygon points="0,-10 -2.5,-7 2.5,-7" fill="#38bdf8" />
    </g>

    <!-- Camera Perspective Angle Badge (positioned neatly beside camera in margin) -->
    <g transform="translate(175, 417)">
      <rect width="108" height="18" rx="4" fill="rgba(12, 21, 39, 0.94)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="0.8" />
      <text x="54" y="12" fill="#38bdf8" font-size="7" font-weight="700" text-anchor="middle" letter-spacing="0.2">
        📷 SUDUT KAMERA 32°
      </text>
    </g>
  </g>

  <!-- ── SWISS ARCHITECTURAL TITLE BLOCK (CARTOUCHE) ── -->
  <g id="title_block" transform="translate(435, 428)">
    <rect x="0" y="0" width="230" height="40" rx="6" fill="rgba(12, 21, 39, 0.96)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <text x="10" y="14" fill="#f8fafc" font-size="9" font-weight="800" letter-spacing="0.5">
      UNIT 626 • 25.0 m²
    </text>
    <text x="10" y="25" fill="#38bdf8" font-size="7.5" font-weight="700">
      KING BED (180x200) • ORIENTASI: HORIZONTAL
    </text>
    <text x="10" y="34" fill="#94a3b8" font-size="6.5" font-weight="500">
      KM DALAM (ENSUITE) • SKALA 1:50
    </text>
    <!-- Micro CAD Version Seal -->
    <rect x="180" y="7" width="40" height="26" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8" />
    <text x="200" y="18" fill="#38bdf8" font-size="6.5" font-weight="800" text-anchor="middle">CAD</text>
    <text x="200" y="27" fill="#4ade80" font-size="5.8" font-weight="700" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- ── MINIMALIST ARCHITECTURAL COMPASS (NORTH) ── -->
  <g id="north_compass" transform="translate(625, 35)">
    <circle cx="15" cy="15" r="13" fill="rgba(12, 21, 39, 0.9)" stroke="rgba(148, 163, 184, 0.4)" stroke-width="1" />
    <line x1="15" y1="4" x2="15" y2="26" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.75" />
    <line x1="4" y1="15" x2="26" y2="15" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.75" />
    <polygon points="15,6 18,15 15,13 12,15" fill="#38bdf8" />
    <polygon points="15,24 18,15 15,17 12,15" fill="#475569" />
    <text x="15" y="2" fill="#38bdf8" font-size="7" font-weight="900" text-anchor="middle">U</text>
  </g>
</svg>