    <text x="310" y="186" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">KAMAR 636</text>
    <text x="310" y="200" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">LUAS: 13.6 m² (3.4x4.0m) • KM LUAR (SHARED)</text>
    <text x="310" y="214" fill="#4ade80" font-size="7" font-weight="700" text-anchor="middle">AI: DOUBLE BED (140x200) • KASUR RIGHT</text>
