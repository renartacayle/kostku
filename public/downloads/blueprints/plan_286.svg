    <path d="M 258 65 L 254 74" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />
    <path d="M 284 65 L 284 76" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />
