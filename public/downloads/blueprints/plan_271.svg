<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%" style="background:#090e17; border-radius:14px; font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Architectural Fine Grid (16px) -->
    <pattern id="grid_cad_271" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(148, 163, 184, 0.04)" stroke-width="0.75" />
    </pattern>
    <!-- Architectural Major Module Grid (80px) -->
    <pattern id="grid_major_271" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
    </pattern>
    <!-- Luxury Parquet Wood Floor Pattern -->
    <pattern id="parquet_271" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#78350f" fill-opacity="0.32" />
      <path d="M 0 10 L 40 10 M 20 0 L 20 10 M 0 20 L 40 20 M 40 10 L 40 20 M 0 0 L 0 10" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.6" />
    </pattern>
    <!-- Bathroom Ceramic Micro-Tile Pattern -->
    <pattern id="bm_tile_271" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#0f2338" />
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="0.6" />
    </pattern>
    <!-- Frosted Glass Blur Filter for Camera Blind Spot -->
    <filter id="frost_blur_271" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
    </filter>
    <!-- Architectural 45-deg Hatch for Blind Spot -->
    <pattern id="blind_hatch_271" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.2" stroke-dasharray="2 2" />
    </pattern>
    <!-- Reading Lamp Warm Radial Glow -->
    <radialGradient id="lamp_glow_271">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>
    <!-- Camera View Frustum Cone Gradient -->
    <radialGradient id="camera_frustum_271" cx="0%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="drop_shadow_271" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background CAD Drafting Paper -->
  <rect width="680" height="480" fill="#090e17" />
  <rect width="680" height="480" fill="url(#grid_cad_271)" />
  <rect width="680" height="480" fill="url(#grid_major_271)" />

  <!-- Sheet Crop Registration Marks (Architectural Standard) -->
  <g stroke="rgba(148, 163, 184, 0.35)" stroke-width="1">
    <path d="M 14 20 L 20 20 M 20 14 L 20 20" />
    <path d="M 666 20 L 660 20 M 660 14 L 660 20" />
    <path d="M 14 460 L 20 460 M 20 466 L 20 460" />
    <path d="M 666 460 L 660 460 M 660 466 L 660 460" />
  </g>

  <!-- ── DIMENSION LINES (PROPORTIONAL 45° ARCHITECTURAL TICKS) ── -->
  <!-- Top Horizontal Dimension (Width) -->
  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="155" y1="54" x2="435" y2="54" opacity="0.85" />
    <line x1="150" y1="59" x2="160" y2="49" stroke-width="1.8" />
    <line x1="430" y1="59" x2="440" y2="49" stroke-width="1.8" />
    <line x1="155" y1="66" x2="155" y2="46" opacity="0.4" stroke-width="0.75" />
    <line x1="435" y1="66" x2="435" y2="46" opacity="0.4" stroke-width="0.75" />
    <rect x="253.0" y="42" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="295.0" y="56" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      4.00 m
    </text>
  </g>

  <!-- Left Vertical Dimension (Length) -->
  <g stroke="#38bdf8" stroke-width="1.2">
    <line x1="137" y1="72" x2="137" y2="387" opacity="0.85" />
    <line x1="132" y1="77" x2="142" y2="67" stroke-width="1.8" />
    <line x1="132" y1="392" x2="142" y2="382" stroke-width="1.8" />
    <line x1="149" y1="72" x2="129" y2="72" opacity="0.4" stroke-width="0.75" />
    <line x1="149" y1="387" x2="129" y2="387" opacity="0.4" stroke-width="0.75" />
    <g transform="translate(137, 229.5)">
      <rect x="-42" y="-10" width="84" height="20" rx="4" fill="#0c1527" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" transform="rotate(-90)" />
      <text x="0" y="4" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5" transform="rotate(-90)">
        4.50 m
      </text>
    </g>
  </g>

  <!-- ── DYNAMICALLY PROPORTIONAL ROOM FLOOR ── -->
  <rect x="155" y="72" width="280" height="315" rx="2" fill="url(#parquet_271)" />
  <rect x="155" y="72" width="280" height="315" fill="none" stroke="rgba(0, 0, 0, 0.38)" stroke-width="5" />

  <!-- ── ARCHITECTURAL CAVITY WALLS (PROPORTIONAL DOUBLE LINE) ── -->
  <rect x="150" y="67" width="290" height="325" fill="none" stroke="#1e293b" stroke-width="8" rx="2" />
  <rect x="146" y="63" width="298" height="333" fill="none" stroke="#475569" stroke-width="1" rx="3" />
  <rect x="154" y="71" width="282" height="317" fill="none" stroke="#64748b" stroke-width="1" rx="1" />

  <!-- 📷 ARCHITECTURAL CAMERA VIEW FRUSTUM (Perspective Distortion Visualizer) -->
  <g id="camera_frustum_cone" opacity="0.85">
    <polygon points="295,401 163.8,132.0 426.2,132.0" fill="url(#camera_frustum_271)" />
    <line x1="295" y1="401" x2="163.8" y2="132.0" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="295" y1="401" x2="426.2" y2="132.0" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />
  </g>

  <!-- 🌫️ CAMERA BLIND SPOT (FROSTED ARCHITECTURAL BLUR) -->
  <g id="unsure_zone" opacity="0.95">
    <rect x="161" y="304" width="77" height="77" rx="5" fill="rgba(15, 23, 42, 0.85)" filter="url(#frost_blur_271)" />
    <rect x="161" y="304" width="77" height="77" rx="5" fill="url(#blind_hatch_271)" stroke="rgba(244, 63, 94, 0.45)" stroke-width="1" stroke-dasharray="3 2" />
    
    <rect x="167" y="329" width="65" height="26" rx="4" fill="rgba(15, 23, 42, 0.94)" stroke="rgba(244, 63, 94, 0.5)" stroke-width="0.8" />
    <text x="199.5" y="340" fill="#fda4af" font-size="7.5" font-weight="700" text-anchor="middle" letter-spacing="0.3">
      ⚲ BLIND SPOT
    </text>
    <text x="199.5" y="349" fill="#94a3b8" font-size="6" font-weight="500" text-anchor="middle">
      Sudut Terbatas Kamera
    </text>
  </g>

  <!-- Area Rug -->
  <rect x="231" y="105" width="128" height="150" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(148, 163, 184, 0.18)" stroke-width="0.8" stroke-dasharray="3 2" />

  <!-- 🛏️ BED CAD BLOCK (True Scale to Room) -->
  <g id="bed_unit" filter="url(#drop_shadow_271)">
    <!-- Solid Wood Headboard -->
    <rect x="239" y="74" width="112" height="8" rx="2" fill="#3b271d" stroke="#78350f" stroke-width="1" />
    
    <!-- Reading Lamp Spots -->
    <circle cx="251" cy="78" r="12" fill="url(#lamp_glow_271)" />
    <circle cx="339" cy="78" r="12" fill="url(#lamp_glow_271)" />
    <circle cx="251" cy="78" r="2.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />
    <circle cx="339" cy="78" r="2.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />

    <!-- White Mattress Sheet Base -->
    <rect x="241" y="80" width="108" height="140" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

    <!-- Duvet with Exact Photo Blanket Hex -->
    <rect x="241" y="124" width="108" height="94" rx="3" fill="#f8fafc" stroke="rgba(0,0,0,0.15)" stroke-width="0.8" />
    
    <!-- Turnback Line -->
    <path d="M 241 124 Q 295.0 130 349 124" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Accent Bed Runner -->
    <rect x="241" y="188" width="108" height="24" fill="#dc2626" opacity="0.88" />
    <line x1="241" y1="188" x2="349" y2="188" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />

    <!-- Dual Hotel Pillows -->
    <rect x="245" y="86" width="42" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <path d="M 251 98 Q 266.0 101 281 98" fill="none" stroke="#cbd5e1" stroke-width="0.8" />
    
    <rect x="303" y="86" width="42" height="24" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <path d="M 309 98 Q 324.0 101 339 98" fill="none" stroke="#cbd5e1" stroke-width="0.8" />
  </g>

  <!-- Bedside Nakas -->
  <g filter="url(#drop_shadow_271)">
    <rect x="213" y="82" width="22" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="224" cy="93" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" opacity="0.85" />
    <circle cx="224" cy="93" r="1.5" fill="#d97706" />
  </g>

  <!-- Bedside Nakas -->
  <g filter="url(#drop_shadow_271)">
    <rect x="355" y="82" width="22" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="366" cy="93" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" opacity="0.85" />
    <circle cx="366" cy="93" r="1.5" fill="#d97706" />
  </g>

  <!-- 🚪 WARDROBE (Scaled) -->
  <g id="wardrobe" filter="url(#drop_shadow_271)">
    <rect x="347" y="341" width="80" height="38" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <line x1="353" y1="360.0" x2="421" y2="360.0" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="387.0" y1="341" x2="387.0" y2="379" stroke="#38bdf8" stroke-width="1.2" />
  </g>

  <!-- 🖥️ WORK DESK & ERGONOMIC CHAIR (Scaled) -->
  <g id="desk_setup" filter="url(#drop_shadow_271)">
    <rect x="163" y="341" width="74" height="38" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <!-- Laptop -->
    <rect x="188.0" y="347" width="24" height="15" rx="1.5" fill="#0f172a" stroke="#60a5fa" stroke-width="0.8" />
    <rect x="190.0" y="349" width="20" height="10" rx="1" fill="#38bdf8" opacity="0.65" />
    
    <!-- Ergonomic Chair -->
    <ellipse cx="200" cy="389" rx="11" ry="8" fill="#334155" stroke="#94a3b8" stroke-width="1" />
    <path d="M 190 393 Q 200 396 210 393" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  </g>

  <!-- ❄️ AC UNIT -->
  <g id="ac_unit">
    <rect x="266" y="73" width="58" height="10" rx="2" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2" />
    <line x1="271" y1="80" x2="319" y2="80" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="318" cy="77" r="1" fill="#22c55e" />
  </g>

  <!-- 🧊 MINI FRIDGE -->
  <g id="fridge" filter="url(#drop_shadow_271)">
    <rect x="392" y="220" width="35" height="35" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <line x1="423" y1="226" x2="423" y2="249" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- 🪟 WINDOW (LEFT WALL) -->
  <g id="window_left">
    <rect x="148" y="192" width="6" height="77" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <line x1="151" y1="192" x2="151" y2="268" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- 🚪 MAIN ENTRANCE DOORWAY -->
  <g id="main_door">
    <rect x="265" y="383" width="60" height="8" fill="#090e17" />
    <path d="M 265 387 A 52 52 0 0 1 317 335" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.75" />
    <line x1="265" y1="387" x2="265" y2="335" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="270" cy="343" r="1.5" fill="#38bdf8" />
  </g>

  <!-- 📷 CAMERA SIGHTLINE RAY & PERSPECTIVE BADGE -->
  <g id="camera_marker_overlay">
    <!-- Central Sightline Ray from Camera to Bed Center -->
    <line x1="295" y1="401" x2="295" y2="150" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.85" />
    <circle cx="295" cy="150" r="3" fill="#38bdf8" opacity="0.85" />
    <circle cx="295" cy="150" r="6.5" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />

    <!-- Camera Icon Glyph -->
    <g transform="translate(295, 401) rotate(0.0)">
      <rect x="-9" y="-6" width="18" height="12" rx="2.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      <path d="M -3 -6 L -1.5 -8.5 L 1.5 -8.5 L 3 -6 Z" fill="#38bdf8" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" stroke="#ffffff" stroke-width="0.9" />
      <circle cx="0" cy="0" r="1.8" fill="#38bdf8" />
      <polygon points="0,-10 -2.5,-7 2.5,-7" fill="#38bdf8" />
    </g>

    <!-- Camera Perspective Angle Badge (positioned neatly beside camera in margin) -->
    <g transform="translate(175, 392)">
      <rect width="108" height="18" rx="4" fill="rgba(12, 21, 39, 0.94)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="0.8" />
      <text x="54" y="12" fill="#38bdf8" font-size="7" font-weight="700" text-anchor="middle" letter-spacing="0.2">
        📷 SUDUT KAMERA 32°
      </text>
    </g>
  </g>

  <!-- ── SWISS ARCHITECTURAL TITLE BLOCK (CARTOUCHE) ── -->
  <g id="title_block" transform="translate(435, 428)">
    <rect x="0" y="0" width="230" height="40" rx="6" fill="rgba(12, 21, 39, 0.96)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <text x="10" y="14" fill="#f8fafc" font-size="9" font-weight="800" letter-spacing="0.5">
      UNIT 621 • 18.0 m²
    </text>
    <text x="10" y="25" fill="#38bdf8" font-size="7.5" font-weight="700">
      QUEEN BED (160x200) • ORIENTASI: TEGAK
    </text>
    <text x="10" y="34" fill="#94a3b8" font-size="6.5" font-weight="500">
      KM LUAR (SHARED) • SKALA 1:50
    </text>
    <!-- Micro CAD Version Seal -->
    <rect x="180" y="7" width="40" height="26" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8" />
    <text x="200" y="18" fill="#38bdf8" font-size="6.5" font-weight="800" text-anchor="middle">CAD</text>
    <text x="200" y="27" fill="#4ade80" font-size="5.8" font-weight="700" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- ── MINIMALIST ARCHITECTURAL COMPASS (NORTH) ── -->
  <g id="north_compass" transform="translate(625, 35)">
    <circle cx="15" cy="15" r="13" fill="rgba(12, 21, 39, 0.9)" stroke="rgba(148, 163, 184, 0.4)" stroke-width="1" />
    <line x1="15" y1="4" x2="15" y2="26" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.75" />
    <line x1="4" y1="15" x2="26" y2="15" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.75" />
    <polygon points="15,6 18,15 15,13 12,15" fill="#38bdf8" />
    <polygon points="15,24 18,15 15,17 12,15" fill="#475569" />
    <text x="15" y="2" fill="#38bdf8" font-size="7" font-weight="900" text-anchor="middle">U</text>
  </g>
</svg>