    </pattern>
    <pattern id="parquet_107" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#5b3b70" fill-opacity="0.34" />
      <path d="M 0 10 L 40 10 M 20 0 L 20 10 M 0 20 L 40 20 M 40 10 L 40 20 M 0 0 L 0 10" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.6" />
    </pattern>
    <pattern id="bm_tile_107" width="12" height="12" patternUnits="userSpaceOnUse">
