# =================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR KOSTKU
# Taruh di /etc/nginx/sites-available/kostku.conf lalu symlink ke sites-enabled
# =================================================================

upstream kostku_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS (setelah certbot jalan)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Root location (Frontend & API proxied to Express backend)
    location / {
        proxy_pass http://kostku_backend;
        proxy_http_version 1.1;

        # WebSocket & Headers support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets cache optimization
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf)$ {
        proxy_pass http://kostku_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Android APK download route direct streaming
    location /downloads/ {
        proxy_pass http://kostku_backend;
        proxy_set_header Host $host;
        add_header Content-Disposition "attachment";
    }
}
